<style>

:root[data-theme="dark"]{--bg:#1c1012;--surface:#271618;--ink:#fbeceb;--sub:#d0a9a6;--line:#4a2a2d;--pri:#ff7b7f;--pri-ink:#2a0709;--soft:#3b1d20;--red:#ff7b7f;--ok:#e5484d;--ng:#a58a8c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6;padding-bottom:84px}
svg.lucide{width:1.25em;height:1.25em;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header{padding:20px 0 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;display:flex;align-items:center;gap:8px}
.prog{margin-top:12px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}

.grid{display:grid;gap:12px;grid-template-columns:1fr}

.py{color:var(--sub);font-size:.9375rem;margin-top:2px}
.ja{color:var(--sub);font-size:.9375rem;margin-top:4px}
.acts{display:flex;gap:8px;flex:none}
.ib{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
.ib.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.ib[data-sp]{background:var(--soft);color:var(--pri);border-color:transparent}
.mn{display:flex;flex-direction:column;gap:8px}
.mn .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--pri);display:grid;place-items:center}
.mn h3{margin:4px 0 0;font-size:1.0625rem}
.mn p{margin:0;color:var(--sub);font-size:.9375rem}
.mn .tip{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.875rem;color:var(--ink)}
.note{display:flex;gap:10px;margin-top:12px;background:var(--soft);border-radius:14px;padding:14px 16px;font-size:.9375rem}
.q h2{font-size:1rem;margin:0 0 4px;color:var(--sub);font-weight:500}
.q .qt{font-size:1.375rem;font-weight:700;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;min-height:56px}
.opt small{display:block;color:var(--sub);font-size:.875rem}
.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.right small{color:#fff}
.opt.wrong{border-color:var(--ng);color:var(--ng)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--pri);color:var(--pri-ink);border:0;border-radius:12px;padding:12px 20px;font-weight:700;min-height:48px;margin-top:14px}
.score{font-size:2.25rem;font-weight:700}
.stat{display:flex;justify-content:space-between;font-size:.875rem;color:var(--sub);margin-bottom:12px}
h1 svg,.note svg,.chip svg,nav button svg{color:var(--pri)}
.chip[aria-pressed="true"] svg{color:var(--pri-ink)}
.inp{width:100%;font:inherit;font-size:1.0625rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-height:48px}
.inp:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#res{display:grid;gap:12px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.main.long{font-size:1.125rem}
textarea.inp{resize:vertical;line-height:1.6}
.btn:disabled{opacity:.6}
@media (min-width:720px){
 .grid{grid-template-columns:1fr 1fr}
 body{padding-bottom:24px}
 nav{position:static;border:0;background:none;padding:0;justify-content:flex-start;margin:4px 0 12px}
 nav button{flex-direction:row;gap:8px;max-width:none;flex:none;padding:10px 18px;font-size:.9375rem;border:1px solid var(--line);background:var(--surface);min-height:48px}
 nav button[aria-selected="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
 nav button[aria-selected="true"] svg{color:var(--pri-ink)}
 .wrap{padding:0 24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

if(!q)el.innerHTML=`<div class="note"><i data-lucide="lightbulb"></i><div>日本語を入力するか、上の例を押してください。端末内のフレーズ集から近い文を探すので、通信なしで使えます。</div></div>`;
else{const hits=find(q),ws=[...WP,...WT].filter(w=>q.includes(w[0]));
el.innerHTML=(hits.length?`<div class="grid">${hits.map((p,i)=>tcard(p,"r"+i,p[0])).join("")}</div>`:`<div class="note"><i data-lucide="info"></i><div>近いフレーズが見つかりません。「コーヒー」「トイレ」のように単語を短く入力してみてください。</div></div>`)+(ws.length?`<div class="stat" style="margin:8px 0 0"><span>入力に含まれる単語</span></div><div class="grid">${ws.map((w,i)=>tcard(w,"w"+i,w[0])).join("")}</div>`:"")}
if(window.lucide)lucide.createIcons()}
let trM="off",trL="",lgS=null;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function chunks(t,n){const out=[];let cur="";t.split(/(?<=[。！？!?\n])/).forEach(s=>{while(s.length>n){if(cur){out.push(cur);cur=""}out.push(s.slice(0,n));s=s.slice(n)}if((cur+s).length>n){out.push(cur);cur=s}else cur+=s});if(cur)out.push(cur);return out.filter(x=>x.trim())}
async function xlate(text,t){const tl=t==="zh"?"zh-CN":"en",out=[];
for(const c of chunks(text,140)){const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(c)+"&langpair=ja|"+tl);if(!r.ok)throw{code:"http",status:r.status};const j=await r.json();const x=(j.responseData&&j.responseData.translatedText)||"";if(+j.responseStatus!==200||/MYMEMORY WARNING/i.test(x))throw{code:"quota"};out.push(x)}
return out.join(t==="zh"?"":" ")}
async function lgRun(){const q=trL.trim();if(!q)return;const t=trT;lgS={st:"load"};render();
try{const tx=await xlate(q,t);lgS={st:"done",t,o:{translation:tx,pinyin:""}}}
catch(e){const c=e&&e.code;lgS={st:"err",msg:c==="quota"?"無料枠の上限に達しました。時間をおいてからお試しください。フレーズ検索は引き続き使えます。":c==="http"?"翻訳サービスがエラーを返しました（"+e.status+"）。時間をおいてお試しください。":navigator.onLine===false?"オフラインです。ネットに接続するか、フレーズ検索を使ってください。":"翻訳に失敗しました。通信状況を確認してもう一度お試しください。"}}
render()}
function lgRes(){const s=lgS;
if(!s)return `<div class="note"><i data-lucide="lightbulb"></i><div>日本語の文章を入力して「翻訳する」を押してください。メールの文面や説明文のような長い文章にも使えます。ネット接続が必要です。</div></div>`;
if(s.st==="load")return `<div class="note"><i data-lucide="loader"></i><div>翻訳しています…</div></div>`;
if(s.st==="err")return `<div class="note"><i data-lucide="info"></i><div>${esc(s.msg)}</div></div>`;
const zh=s.t==="zh",tx=s.o.translation||"";L["g0"]=[String(tx),zh?"zh-CN":"en-US"];
return `<article class="card"><div class="main long ${zh?"zh":"en"} pre">${esc(tx)}</div>${zh&&s.o.pinyin?`<div class="py pre">${esc(s.o.pinyin)}</div>`:""}<div class="acts" style="margin-top:12px"><button class="ib" data-sp="g0" aria-label="音声を再生"><i data-lucide="volume-2"></i></button><button class="ib" data-cp="g0" aria-label="コピー"><i data-lucide="copy"></i></button></div></article>`}
function modeChips(){return `<div class="chips" role="group">${[["off","wifi-off","フレーズ検索（オフライン）"],["on","wifi","長文翻訳（オンライン）"]].map(m=>`<button class="chip" data-tm="${m[0]}" aria-pressed="${trM===m[0]}"><i data-lucide="${m[1]}"></i>${m[2]}</button>`).join("")}</div>`}
function viewLg(){return `<div class="chips" role="group">${[["zh","中国語"],["en","英語"]].map(t=>`<button class="chip" data-tt="${t[0]}" aria-pressed="${trT===t[0]}"><i data-lucide="${t[0]==="zh"?"languages":"globe"}"></i>日本語から${t[1]}へ</button>`).join("")}</div><p class="ja" style="margin:0 0 12px">無料の翻訳サービス（MyMemory）を使います。1日あたりの無料枠があります。</p><div class="card"><label for="lgin" class="stat" style="margin:0 0 8px">日本語の文章を入力（2000文字まで）</label><textarea id="lgin" class="inp" rows="6" maxlength="2000" placeholder="例: 明日の会議は10時からです。資料は事前にメールでお送りします。">${esc(trL)}</textarea><button class="btn" data-act="lgrun" ${lgS&&lgS.st==="load"?"disabled":""}><i data-lucide="send"></i>翻訳する</button></div><div style="margin-top:12px">${lgRes()}</div>`}
function viewTr(){return modeChips()+(trM==="on"?viewLg():viewOff())}
function viewOff(){return `<div class="chips" role="group">${[["zh","中国語"],["en","英語"]].map(t=>`<button class="chip" data-tt="${t[0]}" aria-pressed="${trT===t[0]}"><i data-lucide="${t[0]==="zh"?"languages":"globe"}"></i>日本語から${t[1]}へ</button>`).join("")}</div><div class="card"><label for="trin" class="stat" style="margin:0 0 8px">日本語を入力</label><input id="trin" class="inp" value="${trQ.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}" placeholder="例: トイレはどこですか" autocomplete="off"></div><div class="chips" style="padding-top:12px">${EX.map(e=>`<button class="chip" data-ex="${e}">${e}</button>`).join("")}</div><div id="res"></div>`}
function viewMn(){return `<div class="grid">${MN.map(m=>`<article class="card mn"><div class="ic"><i data-lucide="${m[0]}"></i></div><h3>${m[1]}</h3><p>${m[2]}</p><div class="tip">${m[3]}</div></article>`).join("")}</div><div class="note"><i data-lucide="info"></i><div>ビザの要否、ネット接続、決済手段などの制度やサービスは変わることがあります。出発の前に、外務省や大使館、利用する航空会社の最新情報を確認してください。</div></div>`}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function newQuiz(){quiz={qs:shuffle(items).slice(0,10),n:0,score:0,ans:null}}
function optHtml(it,cls){const t=it.k==="zh"?`${it.zh}<small>${it.py}</small>`:it.en;return t}
function viewQz(){if(!quiz)newQuiz();
if(quiz.n>=quiz.qs.length){return `<div class="card q" style="text-align:center"><h2>結果</h2><div class="score">${quiz.score} / ${quiz.qs.length}</div><p>${quiz.score>=8?"とても良い出来です。":quiz.score>=5?"あと少しです。間違えたフレーズを復習しましょう。":"各タブで音声を聞いて、もう一度挑戦しましょう。"}</p><button class="btn" data-act="retry"><i data-lucide="rotate-ccw"></i>もう一度</button></div>`}
const q=quiz.qs[quiz.n];if(!q.o)q.o=shuffle([q,...shuffle(items.filter(i=>i.k===q.k&&i.id!==q.id)).slice(0,3)]);
return `<div class="stat"><span>問題 ${quiz.n+1} / ${quiz.qs.length}</span><span>正解 ${quiz.score}</span></div><div class="card q"><h2>この意味のフレーズはどれですか</h2><div class="qt">${q.ja}</div><div class="opts">${q.o.map(o=>{let c="opt";if(quiz.ans){if(o.id===q.id)c+=" right";else if(o.id===quiz.ans)c+=" wrong"}return `<button class="${c}" data-ans="${o.id}" ${quiz.ans?"disabled":""}>${optHtml(o)}</button>`}).join("")}</div>${quiz.ans?`<button class="btn" data-act="next"><i data-lucide="${quiz.n+1>=quiz.qs.length?"flag":"arrow-right"}"></i>${quiz.n+1>=quiz.qs.length?"結果を見る":"次の問題"}</button>`:""}</div>`}
function stats(){const n=items.filter(i=>store[i.id]).length;$("#pb").style.width=(n/items.length*100)+"%";$("#pl").textContent=`全${items.length}フレーズ中 ${n} 個を覚えました`}
function render(){$("#nav").innerHTML=TABS.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${tab===t[0]}"><i data-lucide="${t[1]}"></i>${t[2]}</button>`).join("");
$("#app").innerHTML=tab==="mn"?viewMn():tab==="qz"?viewQz():tab==="tr"?viewTr():viewLang(tab);stats();if(tab==="tr")showRes();if(window.lucide)lucide.createIcons()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.tab){tab=d.tab;window.scrollTo(0,0)}
else if(d.tm)trM=d.tm;
else if(d.cp){try{navigator.clipboard.writeText(L[d.cp][0]).catch(()=>{})}catch(e){}return}
else if(d.act==="lgrun"){lgRun();return}
else if(d.tt)trT=d.tt;
else if(d.ex)trQ=d.ex;
else if(d.cat)cat[tab]=d.cat;
else if(d.sp){speak(d.sp);return}
else if(d.lr){store[d.lr]=!store[d.lr];save()}
else if(d.ans){const q=quiz.qs[quiz.n];quiz.ans=d.ans;if(d.ans===q.id)quiz.score++;speak(q.id)}
else if(d.act==="next"){quiz.n++;quiz.ans=null}
else if(d.act==="retry")newQuiz();
else return;render()});
document.addEventListener("input",e=>{if(e.target.id==="trin"){trQ=e.target.value;showRes()}else if(e.target.id==="lgin")trL=e.target.value;});
render();
</script>
</body>
</html>
